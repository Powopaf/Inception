volumes:
        wordpress:
                name: wordpress
        mariadb:
                name: mariadb

networks:
  inception:
    name: inception

services:
  nginx:
    container_name: nginx
    build: ./srcs/requirements/nginx/.
    image: nginx:42
    ports:
     - "443:443"
    depends_on:
      - wordpress
    volumes:
     - wordpress:/var/www/html
    networks:
      - inception
    env_file:
      - ./srcs/.env
    restart: always
  wordpress:
    container_name: wordpress
    build: ./srcs/requirements/wordpress/.
    image: wordpress:42
    depends_on:
      - mariadb
      - redis
    volumes:
      - wordpress:/var/www/html
    env_file:
      - ./srcs/.env
    networks:
      - inception
    restart: always
  redis:
    container_name: redis
    image: redis:7-alpine
    networks:
      - inception
    restart: always
  mariadb:
    container_name: mariadb
    build: ./srcs/requirements/mariadb/.
    image: mariadb:42
    volumes:
      - mariadb:/var/lib/mysql
    env_file:
      - ./srcs/.env
    networks:
      - inception
    restart: always